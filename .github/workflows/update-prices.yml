name: Actualizar precios diarios

on:
  schedule:
    # 08:15 hora de Lima (UTC-5) = 13:15 UTC. Ajusta si quieres otra hora.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      test_limit:
        description: "Solo probar con los primeros N productos (vacío = todos los 193)"
        required: false
        default: ""

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # con 193 productos x 4 cadenas automatizadas, la corrida completa puede tomar 40-60 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Sin "cache: npm": eso necesita un package-lock.json ya generado,
          # y como nadie corrió "npm install" todavía (ni tu Mac ni este
          # entorno tienen Node.js instalado), ese archivo no existe aún.

      - run: npm install

      - name: Instalar Chromium para Playwright (necesario para Tottus)
        run: npx playwright install --with-deps chromium

      - name: Correr actualizador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT || 'AhorraLimaBot/0.1' }}
          REQUEST_DELAY_MS: "1200"
          TEST_LIMIT: ${{ inputs.test_limit }}
        run: npm run update-prices
